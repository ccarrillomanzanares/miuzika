<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tararea y te lo devuelvo en MIDI</title>
<style>
  :root{
    --fondo:#0e1013; --panel:#171a1f; --panel2:#1e2229; --borde:#2a2f38;
    --texto:#e8eaed; --tenue:#9aa3ae; --acento:#4ade80; --acento2:#22d3ee;
    --rojo:#ef4444; --ambar:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .env{max-width:820px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--tenue);font-size:13.5px;margin-bottom:24px}
  .panel{background:var(--panel);border:1px solid var(--borde);border-radius:14px;
    padding:20px;margin-bottom:18px}
  .grabadora{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--borde);
    background:var(--panel2);color:var(--texto);padding:11px 20px;transition:.15s}
  button:hover:not(:disabled){border-color:#3d444f;background:#252a32}
  button:disabled{opacity:.4;cursor:not-allowed}
  .rec{background:var(--acento);color:#06210f;border-color:transparent;font-weight:650;
    padding:14px 30px;font-size:16px}
  .rec:hover:not(:disabled){background:#5ee98f;border-color:transparent}
  .rec.grabando{background:var(--rojo);color:#fff;animation:pulso 1.1s infinite}
  @keyframes pulso{0%,100%{opacity:1}50%{opacity:.62}}
  .nivel{flex:1;min-width:200px;height:12px;background:#0a0c0f;border-radius:6px;
    overflow:hidden;border:1px solid var(--borde)}
  .nivel i{display:block;height:100%;width:0%;background:linear-gradient(90deg,
    var(--acento),var(--acento2));transition:width .06s linear}
  .tiempo{font-variant-numeric:tabular-nums;color:var(--tenue);min-width:52px;font-size:14px}
  .estado{color:var(--tenue);font-size:13.5px;margin-top:12px;min-height:20px}
  .estado.err{color:var(--rojo)}
  .datos{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .chip{background:var(--panel2);border:1px solid var(--borde);border-radius:8px;
    padding:6px 12px;font-size:13px}
  .chip b{color:var(--acento);font-weight:600}
  canvas{width:100%;height:150px;background:#0a0c0f;border:1px solid var(--borde);
    border-radius:10px;display:block;margin-bottom:16px}
  audio{width:100%;margin:7px 0;height:34px}
  .fila{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .etq{color:var(--tenue);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:3px}
  details{margin-top:14px}
  summary{cursor:pointer;color:var(--tenue);font-size:13.5px}
  pre{background:#0a0c0f;border:1px solid var(--borde);border-radius:9px;padding:12px;
    overflow:auto;font-size:12px;max-height:230px;margin:10px 0 0;color:#c9d1d9}
  .hist{color:var(--tenue);font-size:13px;margin-top:26px}
  .hist h2{font-size:14px;color:var(--texto);font-weight:600;margin:0 0 8px}
  .hist ol{margin:0;padding-left:20px}
  .hist li{margin:3px 0}
  .hist a{color:var(--acento2);text-decoration:none}
  .hist a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="env">
  <h1>Tararea y te lo devuelvo en MIDI</h1>
  <div class="sub">Graba desde el micrófono. Se extrae la melodía con <code>librosa.pyin</code>
    y sale partitura, MIDI y audio. No se inventa nada: solo lo que tarareas.</div>

  <div class="panel">
    <div class="grabadora">
      <button id="btn" class="rec">● Grabar</button>
      <div class="nivel"><i id="barra"></i></div>
      <div class="tiempo" id="reloj">0,0 s</div>
    </div>
    <div class="estado" id="estado">Pulsa grabar y tararea cuatro o cinco notas con ritmo claro.</div>
  </div>

  <div id="resultado"></div>
  <div class="hist" id="historial" style="display:none">
    <h2>Tomas de esta sesión</h2>
    <ol id="listahist"></ol>
  </div>
</div>

<script>
const SR = 44100;
let ctx, stream, nodo, fuente, buf = [], grabando = false, t0 = 0, timer = null;
const btn = document.getElementById('btn');
const barra = document.getElementById('barra');
const reloj = document.getElementById('reloj');
const estado = document.getElementById('estado');
const resultado = document.getElementById('resultado');
const historial = document.getElementById('historial');
const listahist = document.getElementById('listahist');
let contador = 0;

function di(txt, err){ estado.textContent = txt; estado.className = 'estado' + (err?' err':''); }

// ---------- codificar PCM float -> WAV 16 bits ----------
function aWav(muestras, sr){
  const n = muestras.length;
  const buf = new ArrayBuffer(44 + n*2);
  const v = new DataView(buf);
  const str = (off,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(off+i, s.charCodeAt(i)); };
  str(0,'RIFF'); v.setUint32(4, 36+n*2, true); str(8,'WAVE');
  str(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24, sr, true); v.setUint32(28, sr*2, true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); str(36,'data'); v.setUint32(40, n*2, true);
  let off = 44;
  for(let i=0;i<n;i++){
    let s = Math.max(-1, Math.min(1, muestras[i]));
    v.setInt16(off, s<0 ? s*0x8000 : s*0x7FFF, true);
    off += 2;
  }
  return new Blob([buf], {type:'audio/wav'});
}

// ---------- grabar ----------
async function empezar(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      channelCount:1, echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
  }catch(e){
    di('No he podido acceder al micrófono: '+e.message+
       '. Revisa el permiso del navegador para este sitio.', true);
    return;
  }
  ctx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
  fuente = ctx.createMediaStreamSource(stream);
  nodo = ctx.createScriptProcessor(4096, 1, 1);
  buf = [];
  nodo.onaudioprocess = ev => {
    if(!grabando) return;
    const d = ev.inputBuffer.getChannelData(0);
    buf.push(new Float32Array(d));
    let suma = 0;
    for(let i=0;i<d.length;i+=16) suma += d[i]*d[i];
    const rms = Math.sqrt(suma/(d.length/16));
    barra.style.width = Math.min(100, rms*320).toFixed(1)+'%';
  };
  fuente.connect(nodo);
  nodo.connect(ctx.destination);

  grabando = true; t0 = performance.now();
  btn.textContent = '■ Parar'; btn.classList.add('grabando');
  di('Grabando… tararea ahora. Vuelve a pulsar para terminar.');
  timer = setInterval(()=>{
    reloj.textContent = ((performance.now()-t0)/1000).toFixed(1).replace('.',',')+' s';
  }, 100);
}

function parar(){
  grabando = false;
  if(timer) clearInterval(timer);
  btn.disabled = true;
  btn.textContent = 'Procesando…';
  btn.classList.remove('grabando');
  barra.style.width = '0%';

  try{ nodo.disconnect(); fuente.disconnect(); }catch(e){}
  stream.getTracks().forEach(t=>t.stop());
  if(ctx) ctx.close();

  let total = 0; buf.forEach(b=>total+=b.length);
  const todo = new Float32Array(total);
  let o = 0; buf.forEach(b=>{ todo.set(b,o); o+=b.length; });
  const segundos = total/SR;

  if(segundos < 1.2){
    di('Muy corto ('+segundos.toFixed(1)+' s). Tararea al menos un par de segundos.', true);
    btn.disabled=false; btn.textContent='● Grabar'; return;
  }
  enviar(todo, segundos);
}

async function enviar(muestras, segundos){
  di('Analizando '+segundos.toFixed(1)+' s de audio…');
  const blob = aWav(muestras, SR);
  try{
    const r = await fetch('/analizar', {method:'POST',
      headers:{'Content-Type':'application/octet-stream'}, body:blob});
    if(!r.ok) throw new Error('el servidor devolvió '+r.status);
    const d = await r.json();
    pintar(d);
    di('Listo. '+d.n_notas+' notas detectadas en '+
       (d.segundos_analisis||'?')+' s de análisis.');
  }catch(e){
    di('Error al analizar: '+e.message, true);
  }
  btn.disabled=false; btn.textContent='● Grabar';
}

// ---------- pintar resultado ----------
function b64aBlob(b64, tipo){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:tipo});
}

function pianoRoll(canvas, notas){
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const g = canvas.getContext('2d');
  g.scale(dpr,dpr);
  g.clearRect(0,0,w,h);
  if(!notas.length) return;

  const ms = notas.map(n=>n.midi);
  const lo = Math.min(...ms)-1, hi = Math.max(...ms)+1;
  const fin = Math.max(...notas.map(n=>n.beat+n.dur));
  const pad = 8;

  g.strokeStyle = '#232830'; g.lineWidth = 1;
  for(let b=0; b<=fin; b+=4){
    const x = pad + (b/fin)*(w-2*pad);
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();
  }
  const colores = ['#4ade80','#22d3ee','#a78bfa','#fbbf24'];
  notas.forEach((n,i)=>{
    const x = pad + (n.beat/fin)*(w-2*pad);
    const ancho = Math.max(2, (n.dur/fin)*(w-2*pad));
    const y = h-pad - ((n.midi-lo)/(hi-lo))*(h-2*pad) - 4;
    g.fillStyle = colores[i%colores.length];
    g.fillRect(x, y, ancho, Math.max(3, (h-2*pad)/(hi-lo)*0.8));
  });
}

function pintar(d){
  contador++;
  const midiBlob = b64aBlob(d.midi_b64, 'audio/midi');
  const midiUrl = URL.createObjectURL(midiBlob);
  const wavUrl = URL.createObjectURL(b64aBlob(d.wav_b64, 'audio/wav'));
  const origUrl = URL.createObjectURL(b64aBlob(d.original_b64, 'audio/wav'));

  resultado.innerHTML = `
    <div class="panel">
      <div class="datos">
        <div class="chip"><b>${d.key} ${d.mode==='minor'?'menor':'mayor'}</b></div>
        <div class="chip"><b>${d.bpm}</b> BPM</div>
        <div class="chip"><b>${d.n_notas}</b> notas</div>
        <div class="chip"><b>${d.duracion}</b> s grabados</div>
      </div>
      <div class="etq">Lo que tarareaste</div>
      <audio controls src="${origUrl}"></audio>
      <div class="etq" style="margin-top:9px">Lo que he entendido (voz de coro, para comparar)</div>
      <audio controls src="${wavUrl}"></audio>
      <canvas id="pr${contador}"></canvas>
      <div class="fila">
        <button onclick="descargar('${midiUrl}','${d.nombre_midi}')">Descargar MIDI</button>
        <button onclick="descargar('${encodeURI('data:text/plain;charset=utf-8,'+encodeURIComponent(d.abc))}','${d.nombre}.abc',true)">Descargar ABC</button>
      </div>
      <details>
        <summary>Ver la partitura (ABC) y la semilla</summary>
        <pre>${d.abc.replace(/</g,'&lt;')}</pre>
        <pre>${(d.seed||'').replace(/</g,'&lt;')}</pre>
      </details>
    </div>`;
  pianoRoll(document.getElementById('pr'+contador), d.notas);

  const li = document.createElement('li');
  li.innerHTML = `<a href="${wavUrl}" download="${d.nombre}_transcrito.wav">${d.nombre}</a>
    — ${d.key} ${d.mode==='minor'?'menor':'mayor'}, ${d.bpm} BPM, ${d.n_notas} notas`;
  listahist.prepend(li);
  historial.style.display = 'block';
}

function descargar(url, nombre, esDatos){
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.click();
}

btn.addEventListener('click', ()=> grabando ? parar() : empezar());
window.addEventListener('keydown', e=>{
  if(e.code==='Space' && e.target===document.body){ e.preventDefault(); btn.click(); }
});
</script>
</body>
</html>
