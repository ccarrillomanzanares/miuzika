<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>miuzika</title>
    <script>
      // A single storage origin: always localhost, never 127.0.0.1.
      if (location.hostname === "127.0.0.1" || location.hostname === "[::1]") {
        location.replace(
          `http://localhost${location.port ? `:${location.port}` : ""}${location.pathname}${location.search}${location.hash}`,
        );
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">miuzika</div>
        <div id="song-info" class="song-info"></div>
        <label class="bpm-global" title="The project's tempo. MIDI follows it; a WAV keeps its speed and its place in time.">
          <input id="bpm-global" type="number" min="20" max="300" step="any" disabled /> BPM
        </label>
        <div id="gpu-zona" class="gpu-zona" hidden>
          <span id="modulo-tarea" class="modulo-tarea" hidden></span>
          <button id="modulo-cancelar" type="button" hidden>Cancel</button>
          <span id="gpu-texto" class="gpu-texto" hidden></span>
          <button id="gpu-apagar" class="gpu-apagar" type="button" hidden title="Shut down the GPU: it bills by the hour while on">⏻ Off</button>
        </div>
        <div class="actions">
          <details id="modulos" class="modulos">
            <summary>Modules</summary>
            <div class="modulos-lista">
              <button type="button" data-modulo="ace-step" title="Generate songs, tracks and transformations with ACE-Step on a GPU">ACE-Step</button>
              <button type="button" data-modulo="mulacover" title="A cover with your lyrics and style over a song's or your MIDI's melody and chords. Non-commercial (CC BY-NC 4.0)">MuLaCover</button>
              <button type="button" data-modulo="demucs" title="Separate a mix into drums, bass, vocals and the rest">Demucs</button>
              <button type="button" data-modulo="stableaudio" title="Instrumental music, single instruments and sound effects from a description; transform, repaint or continue audio">Stable Audio</button>
              <button type="button" data-modulo="strudel" title="Write a Strudel pattern and render it to WAV in the browser, with no GPU">Strudel</button>
            </div>
          </details>
          <button id="play" class="icon" data-i18n-title="play" title="Play with the openDAW engine">▶</button>
          <button id="stop" class="icon" data-i18n-title="stop" title="Stop">■</button>
          <button id="undo" class="icon" data-i18n-title="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
          <button id="redo" class="icon" data-i18n-title="redo" title="Redo (Ctrl+Shift+Z)" disabled>↷</button>
          <label class="file" data-i18n-title="abrir.title" title="Open a project (.json/.zip), audio or MIDI"><span data-i18n="abrir">Open</span><input id="open" type="file" multiple accept=".json,.zip,.miuzika.zip,application/json,application/zip,audio/*,.wav,.mid,.midi,audio/midi" /></label>
          <label class="file"><span data-i18n="audio">Audio</span><input id="audio-file" type="file" accept="audio/*" multiple /></label>
          <button id="guardar" data-i18n="guardar" data-i18n-title="guardar.title" title="Write the project file to workspace/proyectos/&lt;slug&gt;/proyecto.json (Ctrl+S)">Save</button>
          <details id="exportar" class="modulos">
            <summary>Export</summary>
            <div class="modulos-lista">
              <button type="button" data-formato="mp3" title="Render the mix with the same engine as Play and save it as MP3 (320 kbps, project title as ID3) in salida/">MP3</button>
              <button type="button" data-formato="wav" title="Render the mix with the same engine as Play and save it as WAV in salida/">WAV</button>
              <button type="button" data-formato="midi" title="Save the notes of the MIDI tracks as a .mid in salida/, with each track's GM instrument (audio tracks are not notes and are left out)">MIDI</button>
            </div>
          </details>
          <button id="pad" type="button" title="Play the laptop's touchpad as an instrument (keys, pads or sliding) and record it into a MIDI track. Windows with a Precision Touchpad">Pad</button>
          <button id="proyectos" data-i18n="proyectos" data-i18n-title="proyectos.title" title="Open a project saved in workspace/proyectos/">Projects</button>
          <button id="ajustes" type="button" title="The accounts the app rents from: GPU providers">Settings</button>
          <button id="recargar" class="recargar" data-i18n="recargar" data-i18n-title="recargar.title" title="The server has newer code than this tab; load it" hidden>↻ new version</button>
          <button id="new-song" data-i18n="nueva" data-i18n-title="nueva.title" title="Close this project and start another one">New</button>
        </div>
      </header>

      <div id="selection-bar" class="selection-bar" hidden>
        <strong id="selection-count">0 tracks</strong>
        <button id="sel-mute" data-i18n="mute">Mute</button>
        <button id="sel-solo" data-i18n="solo">Solo</button>
        <button id="sel-delete" data-i18n="borrar">Delete</button>
        <button id="sel-midi" title="Turn the notes heard in this audio track into a new MIDI track (Basic Pitch, on this computer)" hidden>To MIDI</button>
        <span class="spacer"></span>
        <button id="clip-copy" data-i18n="copiar" data-i18n-title="copiar.title" title="Copy the selected clip (Ctrl+C)">Copy</button>
        <button id="clip-paste" data-i18n="pegar" data-i18n-title="pegar.title" title="Paste at the cursor (Ctrl+V)">Paste</button>
        <button id="clip-dup" data-i18n="duplicar" data-i18n-title="duplicar.title" title="Duplicate right after (Ctrl+D)">Duplicate</button>
        <button id="sel-all" data-i18n="todas">All</button>
        <button id="sel-clear" data-i18n="limpiar">Clear</button>
      </div>

      <main>
        <section class="timeline">
          <div class="track-heads" id="track-heads"></div>
          <div class="canvas-wrap" id="canvas-wrap">
            <canvas id="timeline"></canvas>
          </div>
        </section>
      </main>

      <dialog id="dialogo-proyectos" class="dialogo">
        <div class="dialogo-cabeza">
          <strong data-i18n="proyectos.dialogo">Projects on disk</strong>
          <button id="proyectos-cerrar" class="icon" data-i18n-title="cerrar" title="Close">✕</button>
        </div>
        <div id="lista-proyectos" class="lista-proyectos"></div>
      </dialog>

      <dialog id="dialogo-audio" class="dialogo">
        <strong data-i18n="audio.dialogo">What should I do with these audio files?</strong>
        <p id="dialogo-audio-detalle"></p>
        <div class="dialogo-acciones">
          <button id="audio-anadir"></button>
          <button id="audio-nuevo"></button>
          <button id="audio-cancelar" data-i18n="cancelar">Cancel</button>
        </div>
      </dialog>

      <div id="avisos" class="avisos" hidden></div>

      <footer class="status">
        <span id="status" data-i18n="estado.inicial">Space = play/pause · twice = stop · Double-click a clip = piano roll · Ctrl+wheel = zoom</span>
        <button id="avisos-toggle" class="avisos-toggle" type="button">Log</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
