<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>miuzika - GUI + Strudel</title>
    <script>
      // Un único origen de almacenamiento: siempre localhost, nunca 127.0.0.1.
      if (location.hostname === "127.0.0.1" || location.hostname === "[::1]") {
        location.replace(
          `http://localhost${location.port ? `:${location.port}` : ""}${location.pathname}${location.search}${location.hash}`,
        );
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">miuzika <span>spike</span></div>
        <div id="song-info" class="song-info"></div>
        <div class="actions">
          <button id="play" class="icon" title="Reproducir con el engine de openDAW">▶</button>
          <button id="stop" class="icon" title="Detener">■</button>
          <button id="undo" class="icon" title="Deshacer (Ctrl+Z)" disabled>↶</button>
          <button id="redo" class="icon" title="Rehacer (Ctrl+Shift+Z)" disabled>↷</button>
          <label class="file" title="Abrir proyecto (.json/.zip) o audio (WAV, uno o varios)">Abrir<input id="open" type="file" multiple accept=".json,.zip,.miuzika.zip,application/json,application/zip,audio/*,.wav" /></label>
          <label class="file">Audio<input id="audio-file" type="file" accept="audio/*" multiple /></label>
          <button id="code-lab" title="Escribir un patrón Strudel y renderizarlo a WAV">Strudel</button>
          <button id="chat-toggle" class="active" title="Mostrar u ocultar el chat del agente">Chat</button>
          <button id="new-song" title="Empezar de cero">Nueva</button>
        </div>
      </header>

      <div id="selection-bar" class="selection-bar" hidden>
        <strong id="selection-count">0 pistas</strong>
        <button id="sel-mute">Mute</button>
        <button id="sel-solo">Solo</button>
        <button id="sel-delete">Borrar</button>
        <span class="spacer"></span>
        <button id="clip-copy" title="Copiar el clip seleccionado (Ctrl+C)">Copiar</button>
        <button id="clip-paste" title="Pegar en el cursor (Ctrl+V)">Pegar</button>
        <button id="clip-dup" title="Duplicar a continuacion (Ctrl+D)">Duplicar</button>
        <button id="sel-all">Todas</button>
        <button id="sel-clear">Limpiar</button>
      </div>

      <main>
        <section class="timeline">
          <div class="track-heads" id="track-heads"></div>
          <div class="canvas-wrap" id="canvas-wrap">
            <canvas id="timeline"></canvas>
          </div>
        </section>

        <aside class="chat">
          <div class="chat-head">
            <strong>Agente</strong>
            <label class="destino" title="Dónde ejecuta Python el agente: este portátil o una GPU de Lambda">
              <select id="chat-destino">
                <option value="cpu">CPU</option>
                <option value="lambda">GPU Lambda</option>
              </select>
            </label>
          </div>
          <div class="messages" id="messages"></div>
          <form class="chat-composer" id="chat-form">
            <textarea
              id="chat-input"
              rows="1"
              placeholder="Pídele algo al agente… (Enter envía, Shift+Enter salto de línea)"
            ></textarea>
            <button id="chat-send" type="submit" title="Enviar">➤</button>
          </form>
        </aside>
      </main>

      <footer class="status" id="status">Doble clic en un clip = piano roll - Ctrl+rueda = zoom</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
