[project]
name = "humseed"
version = "0.1.0"
description = "LLM de musica que compone a partir de tarareo y ritmo capturados por microfono"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "pretty_midi",
    "mido",
    "sounddevice",
    "music21",
]

[project.scripts]
hum-record = "humseed.record:main"
hum-analyze = "humseed.analyze:main"
hum-render = "humseed.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humseed"]
