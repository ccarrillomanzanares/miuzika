<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pad</title>
<style>
 :root{--fg:#e8e8ec;--bg:#14141a;--panel:#1c1c24;--borde:#33333f;--ok:#48d17a}
 *{box-sizing:border-box}
 body{margin:0;padding:16px;background:var(--bg);color:var(--fg);
      font:14px/1.45 system-ui,-apple-system,sans-serif}
 h1{font-size:13px;margin:0 0 12px;font-weight:600;color:#9a9aab;
    text-transform:uppercase;letter-spacing:.08em}
 .barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
 button{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--borde);
        background:#262631;color:var(--fg);cursor:pointer}
 button:hover:not(:disabled){background:#31313f}
 button:disabled{opacity:.4;cursor:default}
 button.modo.on{background:#1f4d33;border-color:#2c6b47}
 #bGrabar{background:#3a2430;border-color:#5c3348}
 select{font:inherit;padding:5px 8px;border-radius:7px;border:1px solid var(--borde);
        background:#262631;color:var(--fg);max-width:280px}
 label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:13px}
 canvas{background:var(--panel);border:1px solid var(--borde);border-radius:10px;touch-action:none;
        display:block}
 .sub{font-size:12px;color:#8b8b9c}
 .sep{width:1px;height:22px;background:var(--borde);margin:0 4px}
 #estadoLinea{font-size:13px;margin-top:10px;min-height:18px}
 .armada{color:var(--ok)} .inactiva{color:#8b8b9c}
 a{color:#9ecbff}
</style></head><body>
<h1>Pad</h1>

<div class="barra">
  <span class="sub">Modo</span>
  <button class="modo" data-modo="teclas">Teclas</button>
  <button class="modo" data-modo="pads">Pads</button>
  <button class="modo" data-modo="deslizar">Deslizar</button>
  <span class="sep"></span>
  <label class="chk"><input type="checkbox" id="cursor"> el pad no mueve el cursor</label>
  <label class="chk"><input type="checkbox" id="sonido" checked> sonido</label>
</div>

<div class="barra">
  <span class="sub">Sonido</span>
  <select id="motor">
    <option value="navegador">sintetizador del navegador</option>
    <option value="soundfont">soundfont GM</option>
  </select>
  <select id="instrumento"></select>
  <span class="sep"></span>
  <button id="bGrabar">Grabar</button>
  <button id="bPararGrabar" disabled>Parar y guardar</button>
  <span class="sub" id="estadoGrabacion"></span>
  <a id="enlaceMidi" href="#" download style="display:none">descargar el MIDI</a>
</div>

<canvas id="pad" width="520" height="260"></canvas>
<div id="estadoLinea" class="inactiva"></div>

<script>
const BASE = "__BASE__";
const $ = id => document.getElementById(id);
const pad = $('pad'), ctx = pad.getContext('2d');

let contactos = {}, layout = {modo:'teclas', zonas:[]};
let motorSoundfont = false;   // con el soundfont suena el cliente: la pagina no sintetiza
let ac = null, comp = null, ruido = null;
const voces = {};    // dedo -> lo que tiene sonando (para poder callarlo)
const sonando = {};  // indice de zona -> dedo (para encender la tecla o el pad)

// ---------------------------------------------------------------- sonido
function audio(){
  if(ac) return ac;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  comp = ac.createDynamicsCompressor();
  const master = ac.createGain();
  master.gain.value = 0.8;
  comp.connect(master); master.connect(ac.destination);
  const n = ac.sampleRate * 1.5;          // una tabla de ruido para la percusion
  ruido = ac.createBuffer(1, n, ac.sampleRate);
  const d = ruido.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  return ac;
}
const hz = nota => 440 * Math.pow(2, (nota - 69) / 12);
const velGain = vel => 0.05 + 0.35 * Math.min(vel,127) / 127;

function voz(nota, vel){
  const a = audio();
  const g = a.createGain(), filtro = a.createBiquadFilter();
  filtro.type = 'lowpass'; filtro.frequency.value = 4200;
  const o1 = a.createOscillator(), o2 = a.createOscillator();
  o1.type = 'triangle'; o2.type = 'sine';
  o1.frequency.value = hz(nota); o2.frequency.value = hz(nota) * 2;
  const g2 = a.createGain(); g2.gain.value = 0.22;
  const nivel = velGain(vel), t = a.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(nivel, t + 0.010);
  g.gain.setTargetAtTime(nivel * 0.62, t + 0.010, 0.25);
  o1.connect(g); o2.connect(g2); g2.connect(g);
  g.connect(filtro); filtro.connect(comp);
  o1.start(t); o2.start(t);
  return {parar(){ const fin = a.currentTime + 0.12;
      g.gain.cancelScheduledValues(fin);
      g.gain.setValueAtTime(g.gain.value, fin);
      g.gain.linearRampToValueAtTime(0, fin + 0.18);
      o1.stop(fin + 0.19); o2.stop(fin + 0.19); }};
}

function golpe(nota, vel){   // percusion (numeros General MIDI)
  const a = audio(), t = a.currentTime, nivel = velGain(vel) * 1.6;
  const g = a.createGain(); g.connect(comp);
  const buf = (dur, tipo, f, q) => {
    const s = a.createBufferSource(); s.buffer = ruido;
    const filtro = a.createBiquadFilter(); filtro.type = tipo;
    filtro.frequency.value = f; if(q) filtro.Q.value = q;
    s.connect(filtro); filtro.connect(g);
    g.gain.setValueAtTime(nivel, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.start(t); s.stop(t + dur);
  };
  const seno = (f0, f1, dur) => {
    const o = a.createOscillator(), og = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    og.gain.setValueAtTime(nivel * 1.1, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(og); og.connect(comp); o.start(t); o.stop(t + dur);
  };
  if(nota === 36){ seno(130, 45, 0.28); }
  else if(nota === 38){ buf(0.18, 'bandpass', 1800, 0.8); seno(200, 150, 0.10); }
  else if(nota === 42){ buf(0.05, 'highpass', 7000); }
  else if(nota === 46){ buf(0.32, 'highpass', 6000); }
  else if(nota === 45){ seno(170, 80, 0.30); }
  else if(nota === 50){ seno(250, 120, 0.22); }
  else if(nota === 39){ [0,0.02,0.04].forEach(r => setTimeout(()=>buf(0.09,'bandpass',1200,1), r*1000)); }
  else { buf(1.1, 'highpass', 4200); }
  return {parar(){}};
}

function tocar(nota, vel){
  if(motorSoundfont) return null;        // ya lo toca el soundfont, en el cliente
  if(!$('sonido').checked) return null;
  return layout.modo === 'pads' ? golpe(nota, vel) : voz(nota, vel);
}

// ---------------------------------------------------------------- dibujo
function pintar(){
  const w = pad.width, h = pad.height;
  ctx.fillStyle = '#1c1c24'; ctx.fillRect(0,0,w,h);
  const zonas = layout.zonas || [];

  if(layout.modo === 'teclas'){
    zonas.forEach((z,i) => {
      const x0 = z.x0*w, x1 = z.x1*w;
      const negra = z.etiqueta.includes('#');
      const activa = sonando[i] !== undefined;
      ctx.fillStyle = activa ? '#2f6b4a' : (negra ? '#15151b' : '#26262f');
      ctx.fillRect(x0, 0, x1-x0, h);
      ctx.strokeStyle = '#33333f'; ctx.lineWidth = 1;
      ctx.strokeRect(x0+0.5, 0.5, x1-x0-1, h-1);
      ctx.save();
      ctx.translate((x0+x1)/2, h-8); ctx.rotate(-Math.PI/2);
      ctx.fillStyle = activa ? '#eaffef' : '#9a9aab';
      ctx.font = '11px ui-monospace,monospace'; ctx.textAlign = 'left';
      ctx.fillText(z.etiqueta, 0, 4);
      ctx.restore();
    });
  } else if(layout.modo === 'pads'){
    zonas.forEach((z,i) => {
      const x0 = z.x0*w, y0 = z.y0*h, x1 = z.x1*w, y1 = z.y1*h;
      const activa = sonando[i] !== undefined;
      const grad = ctx.createLinearGradient(0, y0, 0, y1);
      grad.addColorStop(0, activa ? '#3d8f63' : '#22222b');
      grad.addColorStop(1, activa ? '#2b6b48' : '#191920');
      ctx.fillStyle = grad; ctx.fillRect(x0+2, y0+2, x1-x0-4, y1-y0-4);
      ctx.strokeStyle = '#3a3a48'; ctx.strokeRect(x0+2.5, y0+2.5, x1-x0-5, y1-y0-5);
      ctx.fillStyle = activa ? '#ffffff' : '#aab';
      ctx.font = '12px system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(z.etiqueta, (x0+x1)/2, (y0+y1)/2 + 4);
    });
  } else {
    const notas = layout.notas || [];
    ctx.strokeStyle = '#2c2c38'; ctx.lineWidth = 1;
    if(notas.length > 1){
      notas.forEach(n => {
        const x = (n - notas[0]) / (notas[notas.length-1] - notas[0]) * w;
        ctx.beginPath(); ctx.moveTo(x, h*0.35); ctx.lineTo(x, h); ctx.stroke();
      });
    }
    ctx.fillStyle = '#8b8b9c'; ctx.font = '11px ui-monospace,monospace'; ctx.textAlign = 'left';
    ctx.fillText('arriba: suave     abajo: fuerte', 8, 18);
  }

  for(const c of Object.values(contactos)){
    const px = c.x*w, py = c.y*h, col = c.id % 2 ? '#ffaa5a' : '#5ac8ff';
    ctx.beginPath(); ctx.arc(px, py, 14, 0, 6.3);
    ctx.fillStyle = col + '55'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
  }
}

// ---------------------------------------------------------------- mandos
async function accion(url){
  try { await fetch(BASE + url); } catch(e) {}
  refrescar();
}
$('cursor').onchange = () => accion('/cursor?bloquear=' + ($('cursor').checked ? 1 : 0));
$('bGrabar').onclick = () => accion('/grabar');
$('bPararGrabar').onclick = () => accion('/grabar/parar');
$('enlaceMidi').href = BASE + '/grabacion.mid';
$('motor').onchange = () => accion('/motor?tipo=' + $('motor').value);
$('instrumento').onchange = () => accion('/instrumento?programa=' + $('instrumento').value);
document.querySelectorAll('button.modo').forEach(b => {
  b.onclick = () => {
    Object.values(voces).forEach(v => v && v.parar());
    accion('/modo?nombre=' + b.dataset.modo);
  };
});

async function refrescar(){
  let d = null;
  try { d = await (await fetch(BASE + '/estado')).json(); } catch(e) { d = null; }
  if(!d){
    $('estadoLinea').className = 'inactiva';
    $('estadoLinea').textContent = 'sin conexion con la aplicacion';
    return;
  }
  $('bGrabar').disabled = !!d.grabando;
  $('bPararGrabar').disabled = !d.grabando;
  $('estadoGrabacion').textContent = d.grabando
      ? ('grabando ' + d.segundos.toFixed(0) + ' s · ' + d.notas_grabadas + ' notas')
      : '';
  $('enlaceMidi').style.display = d.archivo ? 'inline' : 'none';
  if(d.motor) $('motor').value = d.motor;
  motorSoundfont = d.motor === 'soundfont';
  if(d.instrumento !== null && d.instrumento !== undefined)
    $('instrumento').value = d.instrumento;
  if($('cursor').checked !== !!d.bloquear_cursor) $('cursor').checked = !!d.bloquear_cursor;
  document.querySelectorAll('button.modo').forEach(b =>
    b.classList.toggle('on', b.dataset.modo === d.modo));

  const armada = d.zona_activa;
  $('estadoLinea').className = armada ? 'armada' : 'inactiva';
  let txt = armada ? 'pad armado: toca' : 'acerca el raton al recuadro del pad';
  if(d.motor === 'soundfont' && d.nombre_instrumento) txt += '  ·  ' + d.nombre_instrumento;
  if(!d.en_marcha) txt += '  ·  captura parada';
  $('estadoLinea').textContent = txt;
}

// el pad solo cuenta cuando el puntero esta encima de su recuadro
const armarZona = v => fetch(BASE + '/zona?activa=' + (v ? 1 : 0)).catch(() => {});
pad.addEventListener('pointerenter', () => armarZona(true));
pad.addEventListener('pointerleave', () => armarZona(false));
document.addEventListener('visibilitychange', () => { if(document.hidden) armarZona(false); });
window.addEventListener('blur', () => armarZona(false));

// ---------------------------------------------------------------- eventos
const es = new EventSource(BASE + '/eventos');
es.onmessage = e => {
  const d = JSON.parse(e.data);
  if(d.tipo === 'cuadro'){
    contactos = {};
    for(const c of d.contactos) contactos[c.id] = c;
    pintar();
  } else if(d.tipo === 'layout'){
    layout = d.layout;
    pintar();
  } else if(d.tipo === 'nota'){
    if(d.accion === 'on'){
      if(voces[d.id]) voces[d.id].parar();
      voces[d.id] = tocar(d.nota, d.vel);
      const i = (layout.zonas || []).findIndex(z => z.nota === d.nota);
      if(i >= 0) sonando[i] = d.id;
    } else {
      if(voces[d.id]){ voces[d.id].parar(); delete voces[d.id]; }
      for(const k of Object.keys(sonando)) if(sonando[k] === d.id) delete sonando[k];
    }
    pintar();
  }
};

function llenarInstrumentos(){
  fetch(BASE + '/instrumentos').then(pedir => pedir.json()).then(d => {
    const sel = $('instrumento');
    if(sel.options.length) return;   // la lista no se manda por SSE: si la pagina se
    d.lista.forEach((nombre, i) => { // conecta tarde, se la pedimos nosotros
      const o = document.createElement('option');
      o.value = i; o.textContent = i + ' · ' + nombre;
      sel.appendChild(o);
    });
  }).catch(() => {});
}

pintar();
llenarInstrumentos();
refrescar();
setInterval(refrescar, 500);
</script></body></html>
